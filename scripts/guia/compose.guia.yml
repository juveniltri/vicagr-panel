# Overrides for `npm run guia`: never touch host folders, expose the DB to seed it.
networks:
  vicagr-guia-demo:
    name: vicagr-guia-demo

volumes:
  guia-repos:
  guia-dynamic:
  guia-static:

services:
  traefik:
    volumes:
      - guia-dynamic:/etc/traefik/dynamic
      - guia-static:/etc/traefik/static:ro
  db:
    ports:
      - "127.0.0.1:5434:5432"
  panel:
    networks:
      - vicagr-net
      - vicagr-guia-demo
    volumes:
      - guia-dynamic:/etc/traefik/dynamic
      - guia-static:/etc/traefik/static
      - guia-repos:/var/vicagr/repos
      # Docker Desktop cannot mount / with rslave.
      - /tmp:/hostroot:ro
